<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite Legend — 截图生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;padding:20px}
h1{text-align:center;font-size:24px;margin-bottom:20px;color:#0ff;text-shadow:0 0 20px rgba(0,255,255,.5)}
.generator{max-width:1400px;margin:0 auto}
.scene-list{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-bottom:30px}
.scene-card{background:#111128;border:2px solid #222244;border-radius:12px;padding:16px;width:340px}
.scene-card h3{font-size:14px;color:#0ff;margin-bottom:10px}
.scene-card canvas{width:100%;border-radius:8px;display:block;margin-bottom:10px}
.scene-card .info{font-size:11px;color:#888;margin-bottom:8px}
.btn{display:inline-block;padding:8px 16px;background:#0d6efd;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-right:6px}
.btn:hover{background:#0b5ed7}
.btn.green{background:#198754}.btn.green:hover{background:#157347}
.btn.orange{background:#fd7e14}.btn.orange:hover{background:#dc6a02}
.download-all{display:block;margin:20px auto;padding:12px 32px;background:linear-gradient(135deg,#0d6efd,#90f);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}
.download-all:hover{opacity:.9}
</style>
</head>
<body>
<div class="generator">
<h1>🎮 Kite Legend — 截图生成器</h1>
<div class="scene-list" id="scenes"></div>
<button class="download-all" onclick="downloadAll()">⬇️ 一键下载全部截图</button>
</div>

<script>
// === 游戏视觉风格复制 ===
const W=320,H=480; // 截图canvas尺寸（2x渲染=640x960）
const CW=315,CH=250; // cover canvas尺寸

// 辅助函数
function parseColor(c){
  if(c.startsWith('#')){const n=parseInt(c.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
  return [255,255,255];
}

// 星空背景
function drawStars(ctx,w,h,t){
  ctx.fillStyle='#050518';ctx.fillRect(0,0,w,h);
  // 渐变
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0d0d2a');g.addColorStop(.5,'#0a0a1a');g.addColorStop(1,'#050510');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  // 星星
  for(let i=0;i<80;i++){
    const x=(i*73.3+t*0.5)%w;
    const y=(i*37.7+t*2)%h;
    const s=(i%3===0)?2:1;
    const a=0.3+Math.sin(t*0.05+i)*0.3+0.4;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.fillRect(x,y,s,s);
  }
  // 远景星云
  for(let i=0;i<3;i++){
    const nx=w*(0.2+i*0.3),ny=h*(0.3+i*0.2);
    const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,60);
    const colors=['rgba(80,40,120,0.08)','rgba(40,80,120,0.06)','rgba(120,40,80,0.06)'];
    ng.addColorStop(0,colors[i]);ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng;ctx.beginPath();ctx.arc(nx,ny,60,0,Math.PI*2);ctx.fill();
  }
}

// 玩家飞船
function drawPlayer(ctx,x,y,scale){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  const skinColor='#0ff';
  const bodyColor1='#1a1a3e',bodyColor2='#0d1a3d';
  // 主体
  ctx.beginPath();
  ctx.moveTo(0,-24);ctx.lineTo(16,-4);ctx.lineTo(22,8);ctx.lineTo(14,18);
  ctx.lineTo(0,24);ctx.lineTo(-14,18);ctx.lineTo(-22,8);ctx.lineTo(-16,-4);
  ctx.closePath();
  const grad=ctx.createLinearGradient(0,-24,0,24);
  grad.addColorStop(0,bodyColor1);grad.addColorStop(.3,bodyColor2);
  grad.addColorStop(.7,'#152040');grad.addColorStop(1,'#1a2040');
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle=skinColor;ctx.lineWidth=2;ctx.stroke();
  // 引擎尾焰
  ctx.fillStyle='rgba(0,200,255,0.6)';
  ctx.beginPath();ctx.moveTo(-6,18);ctx.lineTo(0,32);ctx.lineTo(6,18);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,255,255,0.8)';
  ctx.beginPath();ctx.moveTo(-3,18);ctx.lineTo(0,26);ctx.lineTo(3,18);ctx.closePath();ctx.fill();
  // 驾驶舱
  ctx.fillStyle='rgba(0,255,255,0.4)';ctx.beginPath();ctx.ellipse(0,-6,5,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.ellipse(0,-8,3,4,0,0,Math.PI*2);ctx.fill();
  // 翼尖灯
  ctx.fillStyle='#0ff';ctx.beginPath();ctx.arc(-20,6,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(20,6,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// 玩家子弹
function drawPlayerBullet(ctx,x,y,type){
  ctx.save();
  if(type==='spread'){
    ctx.fillStyle='rgba(0,255,255,0.8)';
    ctx.fillRect(x-2,y-8,4,12);
    ctx.fillStyle='#fff';ctx.fillRect(x-1,y-6,2,8);
    ctx.fillStyle='rgba(0,255,255,0.4)';
    ctx.fillRect(x-3,y-4,6,8);
  }else if(type==='laser'){
    ctx.fillStyle='rgba(0,255,0,0.6)';
    ctx.fillRect(x-3,y-16,6,24);
    ctx.fillStyle='#fff';ctx.fillRect(x-1,y-14,2,20);
  }
  ctx.restore();
}

// 敌弹绘制
const EBT={
  normal:{color:'#f44',size:5,glow:'rgba(255,50,50,0.6)',inner:'rgba(255,255,255,0.8)'},
  homing:{color:'#f84',size:5,glow:'rgba(255,136,68,0.6)',inner:'rgba(255,255,255,0.8)'},
  wave:{color:'#4fc',size:4,glow:'rgba(68,255,204,0.6)',inner:'rgba(255,255,255,0.8)'},
  explosive:{color:'#f80',size:7,glow:'rgba(255,136,0,0.7)',inner:'rgba(255,255,200,0.9)'},
  fast:{color:'#fff',size:3,glow:'rgba(255,255,255,0.8)',inner:'rgba(255,255,255,1)'},
  orb:{color:'#a4f',size:9,glow:'rgba(170,68,255,0.5)',inner:'rgba(255,255,255,0.6)'},
  laser:{color:'#f22',size:2,glow:'rgba(255,34,34,0.9)',inner:'#fff'}
};

function drawEnemyBullet(ctx,bx,by,bt,rot,vx,vy){
  const cfg=EBT[bt]||EBT.normal;
  rot=rot||0;vx=vx||0;vy=vy||100;
  if(bt==='laser'){
    ctx.strokeStyle=cfg.color;ctx.lineWidth=cfg.size;ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+vx*.025,by+vy*.025);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+vx*.015,by+vy*.015);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(bt==='fast'){
    const spd=Math.sqrt(vx*vx+vy*vy);
    const nx=spd>0.1?vx/spd:0,ny=spd>0.1?vy/spd:0;
    for(let t=1;t<=3;t++){
      const tx=bx-nx*t*5,ty=by-ny*t*5;
      const alpha=1-t*0.28,sz=2+t*0.8;
      ctx.globalAlpha=alpha;ctx.fillStyle=cfg.glow;
      ctx.beginPath();ctx.moveTo(tx,ty-sz);ctx.lineTo(tx+sz*0.5,ty);ctx.lineTo(tx,ty+sz);ctx.lineTo(tx-sz*0.5,ty);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle='#fff';ctx.globalAlpha=1;
    ctx.beginPath();ctx.moveTo(bx,by-7);ctx.lineTo(bx+2.5,by);ctx.lineTo(bx,by+7);ctx.lineTo(bx-2.5,by);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
  }else if(bt==='wave'){
    const wt=rot*6;
    const wx=bx+Math.sin(wt)*2.5,wy=by+Math.cos(wt*1.3)*1.5;
    ctx.fillStyle=cfg.glow;ctx.beginPath();
    ctx.ellipse(wx,wy,cfg.size*1.6,cfg.size*0.7,wt*0.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=cfg.inner;ctx.beginPath();
    ctx.ellipse(wx,wy,cfg.size*0.4,cfg.size*0.25,wt*0.5,0,Math.PI*2);ctx.fill();
  }else if(bt==='orb'){
    const or=cfg.size;
    ctx.strokeStyle=cfg.color;ctx.lineWidth=2;ctx.globalAlpha=0.7;
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6+rot;const px=bx+Math.cos(a)*or,py=by+Math.sin(a)*or;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.stroke();
    ctx.fillStyle=cfg.glow;ctx.globalAlpha=0.35;ctx.fill();ctx.globalAlpha=0.7;
    const ir=or*0.55;
    ctx.strokeStyle=cfg.color;ctx.lineWidth=1;ctx.globalAlpha=0.5;
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6-rot*1.5;const px=bx+Math.cos(a)*ir,py=by+Math.sin(a)*ir;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.globalAlpha=1;ctx.beginPath();ctx.arc(bx,by,2,0,Math.PI*2);ctx.fill();
  }else if(bt==='explosive'){
    const pulse=1+Math.sin(rot*15)*.2;
    const er=cfg.size*pulse;
    ctx.fillStyle=cfg.glow;ctx.beginPath();
    for(let i=0;i<12;i++){
      const r=i%2===0?er:er*0.5;
      const a=i*Math.PI/6-Math.PI/2+rot*0.3;
      const px=bx+Math.cos(a)*r,py=by+Math.sin(a)*r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,2.2,0,Math.PI*2);ctx.fill();
  }else if(bt==='homing'){
    const spd=Math.sqrt(vx*vx+vy*vy);
    const hx=spd>0.1?vx/spd:0,hy=spd>0.1?vy/spd:0;
    for(let t=1;t<=2;t++){
      const tx=bx-hx*t*6,ty=by-hy*t*6;
      const alpha=1-t*0.4,sz=3+t*1.5;
      ctx.globalAlpha=alpha;ctx.fillStyle=cfg.glow;
      ctx.beginPath();ctx.moveTo(tx,ty-sz);ctx.lineTo(tx+sz*0.6,ty+sz*0.5);ctx.lineTo(tx-sz*0.6,ty+sz*0.5);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle=cfg.glow;ctx.globalAlpha=1;
    ctx.beginPath();
    ctx.moveTo(bx+hx*7,by+hy*7);
    ctx.lineTo(bx+hy*4,hx*-4+by-4);
    ctx.lineTo(bx-hy*4,hx*4+by-4);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#ff0';ctx.lineWidth=1;ctx.globalAlpha=0.7;
    ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=cfg.inner;ctx.beginPath();ctx.arc(bx,by,1.8,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle=cfg.glow;ctx.beginPath();ctx.arc(bx,by,cfg.size,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=cfg.inner;ctx.beginPath();ctx.arc(bx,by-0.8,2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// 敌机绘制
function drawEnemy(ctx,x,y,type,zone,scale){
  scale=scale||1;
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  let bc,sc,cc;
  if(zone==='corporate'){bc='#3a0a0a';sc='#f44';cc='#f66';}
  else if(zone==='military'){bc='#3a1a05';sc='#f84';cc='#fa6';}
  else if(zone==='alien'){bc='#1a0a3a';sc='#90f';cc='#c0f';}
  else if(zone==='cosmic'){bc='#2a0530';sc='#f0f';cc='#f8f';}
  else{bc='#1a1a2a';sc='#fff';cc='#fff';}

  if(type==='boss'){
    // Boss — Corporate钻石形
    const bg=ctx.createLinearGradient(0,-45,0,45);
    bg.addColorStop(0,bc);bg.addColorStop(.5,sc);bg.addColorStop(1,bc);
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(0,-42);ctx.lineTo(30,-20);ctx.lineTo(40,0);ctx.lineTo(30,25);
    ctx.lineTo(10,40);ctx.lineTo(-10,40);ctx.lineTo(-30,25);ctx.lineTo(-40,0);
    ctx.lineTo(-30,-20);ctx.closePath();ctx.fill();
    ctx.strokeStyle=sc+'44';ctx.lineWidth=8;ctx.stroke();
    ctx.strokeStyle=sc;ctx.lineWidth=2.5;ctx.stroke();
    // 能量核心
    const core=ctx.createRadialGradient(0,0,0,0,0,16);
    core.addColorStop(0,'#fff');core.addColorStop(.3,cc);core.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
    // 眼睛
    ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(-12,-5,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(12,-5,3,0,Math.PI*2);ctx.fill();
  }else if(type==='large'){
    ctx.fillStyle=bc;
    ctx.beginPath();
    ctx.moveTo(0,-20);ctx.lineTo(18,-8);ctx.lineTo(22,8);ctx.lineTo(12,18);
    ctx.lineTo(-12,18);ctx.lineTo(-22,8);ctx.lineTo(-18,-8);ctx.closePath();
    ctx.fill();ctx.strokeStyle=sc;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=cc;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  }else if(type==='medium'){
    ctx.fillStyle=bc;
    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(12,0);ctx.lineTo(0,14);ctx.lineTo(-12,0);ctx.closePath();
    ctx.fill();ctx.strokeStyle=sc;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=cc;ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
  }else{
    // small
    ctx.fillStyle=bc;
    ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=sc;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=cc;ctx.beginPath();ctx.arc(0,0,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// 道具绘制
function drawItem(ctx,x,y,type,t){
  const colors={weapon:'#0ff',bomb:'#ff0',star:'#ffd700',shield:'#0f0',coin:'#FD0',health:'#f0f',drone:'#4af',evolve:'#f0f'};
  const c=colors[type]||'#fff';
  const sz=11;
  const yoy=Math.sin(t*4)*3;
  const iy=y+yoy;
  ctx.save();
  if(type==='weapon'){
    ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(x,iy,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c;ctx.globalAlpha=0.5;ctx.beginPath();
    ctx.moveTo(x,iy-sz-3);ctx.lineTo(x+sz+1,iy);ctx.lineTo(x,iy+sz+3);ctx.lineTo(x-sz-1,iy);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.globalAlpha=0.9;ctx.beginPath();
    ctx.moveTo(x,iy-sz+2);ctx.lineTo(x+sz-3,iy);ctx.lineTo(x,iy+sz-2);ctx.lineTo(x-sz+3,iy);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,iy,3,0,Math.PI*2);ctx.fill();
  }else if(type==='bomb'){
    ctx.fillStyle='rgba(255,255,0,0.2)';ctx.beginPath();ctx.arc(x,iy,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c;ctx.beginPath();
    for(let i=0;i<16;i++){const r=i%2===0?sz+3:sz*0.45;const a=i*Math.PI/8-Math.PI/2+t;const px=x+Math.cos(a)*r,py=iy+Math.sin(a)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#f44';ctx.beginPath();ctx.arc(x,iy,3,0,Math.PI*2);ctx.fill();
  }else if(type==='coin'){
    ctx.fillStyle='rgba(255,200,0,0.15)';ctx.beginPath();ctx.arc(x,iy,16,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,iy,sz+1,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#ffcc00';ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(x,iy,sz-2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#b8860b';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('$',x,iy);ctx.textAlign='left';
  }else if(type==='shield'){
    ctx.fillStyle='rgba(0,255,0,0.15)';ctx.beginPath();ctx.arc(x,iy,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c;ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.moveTo(x-sz-2,iy-sz);ctx.quadraticCurveTo(x,iy-sz-4,x+sz+2,iy-sz);
    ctx.lineTo(x+sz+1,iy+sz*0.3);ctx.lineTo(x+sz*0.4,iy+sz+3);ctx.lineTo(x-sz*0.4,iy+sz+3);
    ctx.lineTo(x-sz-1,iy+sz*0.3);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.fillRect(x-1,iy-4,2,8);ctx.fillRect(x-4,iy-1,8,2);
  }else if(type==='health'){
    ctx.fillStyle='rgba(255,0,255,0.15)';ctx.beginPath();ctx.arc(x,iy,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c;ctx.globalAlpha=0.6;
    ctx.fillRect(x-3,iy-8,6,16);ctx.fillRect(x-8,iy-3,16,6);
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(x-1.5,iy-4,3,8);ctx.fillRect(x-4,iy-1.5,8,3);
  }else if(type==='star'){
    ctx.fillStyle='rgba(255,215,0,0.2)';ctx.beginPath();ctx.arc(x,iy,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd700';ctx.beginPath();
    for(let i=0;i<10;i++){const r=i%2===0?sz+2:sz*0.45;const a=i*Math.PI/5-Math.PI/2+t*0.8;const px=x+Math.cos(a)*r,py=iy+Math.sin(a)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(x-2,iy-2,2.5,0,Math.PI*2);ctx.fill();
  }else if(type==='drone'){
    ctx.fillStyle='rgba(68,170,255,0.2)';ctx.beginPath();ctx.arc(x,iy,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c;ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.ellipse(x,iy-4,sz+2,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(x-2,iy-4,4,sz);ctx.globalAlpha=1;
    ctx.fillStyle='#0ff';ctx.beginPath();ctx.arc(x-8,iy+2,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+8,iy+2,2,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// 粒子
function drawParticle(ctx,x,y,size,color,alpha){
  ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

// 爆炸光效
function drawExplosion(ctx,x,y,radius,color,intensity){
  intensity=intensity||1;
  const g=ctx.createRadialGradient(x,y,0,x,y,radius);
  g.addColorStop(0,`rgba(255,255,255,${0.9*intensity})`);
  g.addColorStop(0.2,`rgba(255,200,0,${0.6*intensity})`);
  g.addColorStop(0.5,`${color}`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
}

// === 场景定义 ===
const scenes=[
  {
    name:'封面图 (630×500)',
    desc:'Boss战 + 满屏弹幕 + 玩家飞船',
    w:CW,h:CH,
    render(ctx,t){
      drawStars(ctx,CW,CH,t);
      // Boss
      drawEnemy(ctx,CW/2,CH*0.28,'boss','corporate',1.2);
      // Boss HP条
      ctx.fillStyle='rgba(255,0,0,0.3)';ctx.fillRect(CW/2-60,CH*0.28+55,120,6);
      ctx.fillStyle='#f44';ctx.fillRect(CW/2-60,CH*0.28+55,80,6);
      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(CW/2-60,CH*0.28+55,120,6);
      // Boss标题
      ctx.fillStyle='#f44';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
      ctx.fillText('⚠ Deadline Lord',CW/2,CH*0.28+72);ctx.textAlign='left';
      // 敌弹 — 扇形弹幕
      for(let i=-5;i<=5;i++){
        const a=i*0.22-0.2;
        drawEnemyBullet(ctx,CW/2+Math.sin(a)*30,CH*0.28+45,'normal',t*0.1,Math.sin(a)*120,Math.cos(a)*120+80);

// roundRect辅助
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// 渲染所有场景
const container=document.getElementById('scenes');
const canvases=[];
scenes.forEach((scene,idx)=>{
  const card=document.createElement('div');
  card.className='scene-card';
  const h3=document.createElement('h3');
  h3.textContent=scene.name;
  card.appendChild(h3);
  const info=document.createElement('div');
  info.className='info';
  info.textContent=scene.desc+' · '+(scene.w===CW?'630×500':'640×960')+' (实际2x)';
  card.appendChild(info);
  const canvas=document.createElement('canvas');
  // 2x渲染
  canvas.width=scene.w*2;canvas.height=scene.h*2;
  canvas.style.width='100%';
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);
  scene.render(ctx,0);
  canvases.push({canvas,scene,idx});
  card.appendChild(canvas);
  const btn=document.createElement('button');
  btn.className='btn green';
  btn.textContent='⬇️ 下载PNG';
  btn.onclick=()=>downloadCanvas(canvas,scene.name);
  card.appendChild(btn);
  container.appendChild(card);
});

function downloadCanvas(canvas,name){
  const link=document.createElement('a');
  link.download=name.replace(/[^a-zA-Z0-9]/g,'_')+'.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}

function downloadAll(){
  canvases.forEach((c,i)=>{
    setTimeout(()=>downloadCanvas(c.canvas,c.scene.name),i*500);
  });
}
