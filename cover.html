<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kite Legend - Cover Generator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; }
canvas { border:1px solid #444; image-rendering:pixelated; max-width:90vw; max-height:80vh; }
.btn-row { margin-top:16px; display:flex; gap:12px; }
.btn { padding:12px 28px; font-size:15px; background:#06f; color:#fff; border:none; border-radius:8px; cursor:pointer; }
.btn:hover { background:#08f; }
.note { color:#aaa; margin-top:10px; font-size:13px; }
</style>
</head>
<body>
<canvas id="cv" width="630" height="500"></canvas>
<div class="btn-row">
  <button class="btn" onclick="downloadCover()">Download Cover (630×500)</button>
  <button class="btn" onclick="downloadCover315()">Download Cover (315×250)</button>
</div>
<p class="note">左图用于页面封面，右图用于游戏缩略图（更小更清晰）</p>
<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

// --- Draw everything ---
function drawCover() {
  // Background gradient
  const bg = ctx.createRadialGradient(315, 250, 0, 315, 250, 450);
  bg.addColorStop(0, '#0a0a3a');
  bg.addColorStop(0.5, '#050520');
  bg.addColorStop(1, '#000008');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 630, 500);

  // Stars
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * 630;
    const y = Math.random() * 500;
    const r = Math.random() * 1.8 + 0.3;
    const a = Math.random() * 0.6 + 0.3;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,220,255,' + a + ')';
    ctx.fill();
  }

  // Nebula blobs
  [
    { x: 120, y: 180, r: 140, c1: 'rgba(0,80,255,0.09)', c2: 'transparent' },
    { x: 480, y: 100, r: 110, c1: 'rgba(160,0,255,0.07)', c2: 'transparent' },
    { x: 330, y: 420, r: 160, c1: 'rgba(0,180,200,0.05)', c2: 'transparent' },
  ].forEach(n => {
    const ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    ng.addColorStop(0, n.c1);
    ng.addColorStop(1, n.c2);
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, 630, 500);
  });

  // ---- Player kite (bottom center) ----
  const pkX = 315, pkY = 390;
  // Engine glow
  const pg = ctx.createRadialGradient(pkX, pkY + 10, 0, pkX, pkY + 10, 50);
  pg.addColorStop(0, 'rgba(0,150,255,0.25)');
  pg.addColorStop(1, 'transparent');
  ctx.fillStyle = pg;
  ctx.fillRect(pkX - 50, pkY - 40, 100, 100);

  // Body
  ctx.beginPath();
  ctx.moveTo(pkX, pkY - 28);
  ctx.lineTo(pkX - 20, pkY + 22);
  ctx.lineTo(pkX, pkY + 6);
  ctx.lineTo(pkX + 20, pkY + 22);
  ctx.closePath();
  ctx.fillStyle = '#06f';
  ctx.fill();
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // Wings left
  ctx.beginPath();
  ctx.moveTo(pkX - 20, pkY + 5);
  ctx.lineTo(pkX - 38, pkY + 18);
  ctx.lineTo(pkX - 16, pkY + 20);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,130,255,0.45)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,200,255,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Wings right
  ctx.beginPath();
  ctx.moveTo(pkX + 20, pkY + 5);
  ctx.lineTo(pkX + 38, pkY + 18);
  ctx.lineTo(pkX + 16, pkY + 20);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,130,255,0.45)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,200,255,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Engine particles
  for (let i = 0; i < 8; i++) {
    const ox = (Math.random() - 0.5) * 10;
    const oy = Math.random() * 20 + 5;
    ctx.beginPath();
    ctx.arc(pkX + ox, pkY + 22 + oy, 1.5 - i * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,200,255,' + (0.8 - i * 0.09) + ')';
    ctx.fill();
  }

  // ---- Enemy (top right) ----
  const eX = 490, eY = 130;
  const eg = ctx.createRadialGradient(eX, eY, 0, eX, eY, 35);
  eg.addColorStop(0, 'rgba(255,0,0,0.18)');
  eg.addColorStop(1, 'transparent');
  ctx.fillStyle = eg;
  ctx.fillRect(eX - 40, eY - 40, 80, 80);

  ctx.beginPath();
  ctx.moveTo(eX, eY - 20);
  ctx.lineTo(eX - 16, eY + 16);
  ctx.lineTo(eX + 16, eY + 16);
  ctx.closePath();
  ctx.fillStyle = '#a00';
  ctx.fill();
  ctx.strokeStyle = '#f44';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // Enemy eye glow
  ctx.beginPath();
  ctx.arc(eX, eY - 4, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ff0';
  ctx.fill();

  // ---- Bullets ----
  // Player bullets (cyan向上)
  for (let i = 0; i < 5; i++) {
    const bx = pkX - 20 + i * 10;
    const by = pkY - 45 - i * 22;
    ctx.beginPath();
    ctx.arc(bx, by, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#0ff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bx, by, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,255,255,0.12)';
    ctx.fill();
  }

  // Enemy bullets (orange向下)
  [
    { x: eX - 18, y: eY + 22 },
    { x: eX - 5,  y: eY + 30 },
    { x: eX + 8,  y: eY + 25 },
    { x: eX + 22, y: eY + 32 },
  ].forEach(function(b) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#f84';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,130,0,0.13)';
    ctx.fill();
  });

  // ---- Scattered particles ----
  [
    { x: pkX - 12, y: pkY + 24, c: '0,255,255' },
    { x: pkX + 12, y: pkY + 24, c: '0,255,255' },
    { x: eX,     y: eY - 22, c: '255,200,0' },
    { x: 200,    y: 260,     c: '255,0,200' },
    { x: 430,    y: 330,     c: '0,255,100' },
  ].forEach(function(p) {
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = Math.random() * 14 + 3;
      ctx.beginPath();
      ctx.arc(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, 1.1, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.c + ',' + (0.5 + Math.random() * 0.4) + ')';
      ctx.fill();
    }
  });

  // ---- Title ----
  ctx.textAlign = 'center';

  // Title shadow
  ctx.font = 'bold 52px sans-serif';
  ctx.fillStyle = 'rgba(0,80,255,0.35)';
  ctx.fillText('星际风筝传说', 317, 82);

  // Title main
  // Use gradient text trick
  ctx.save();
  ctx.font = 'bold 52px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('星际风筝传说', 315, 80);
  ctx.globalCompositeOperation = 'source-atop';
  const tg = ctx.createLinearGradient(110, 50, 520, 100);
  tg.addColorStop(0, '#aaf');
  tg.addColorStop(0.5, '#0cf');
  tg.addColorStop(1, '#aaf');
  ctx.fillStyle = tg;
  ctx.fillRect(110, 40, 410, 60);
  ctx.restore();

  // Title stroke outline
  ctx.font = 'bold 52px sans-serif';
  ctx.strokeStyle = 'rgba(0,200,255,0.3)';
  ctx.lineWidth = 1;
  ctx.strokeText('星际风筝传说', 315, 80);

  // Subtitle
  ctx.font = 'bold 17px sans-serif';
  ctx.fillStyle = '#0ff';
  ctx.fillText('Kite Legend — Interstellar', 315, 112);

  // Decorative line
  ctx.beginPath();
  ctx.moveTo(175, 126);
  ctx.lineTo(455, 126);
  ctx.strokeStyle = 'rgba(0,200,255,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Feature badges (manual draw, no roundRect)
  [
    { text: '\uD83C\uDFAE SHMUP',  x: 105, c: '#0ff' },
    { text: '\uD83D\uDC7E BOSS',   x: 250, c: '#f84' },
    { text: '\u26A1 ROGUELITE', x: 400, c: '#ff0' },
    { text: '\uD83C\uDFA8 VISUAL',  x: 535, c: '#0f0' },
  ].forEach(function(b) {
    // Background pill
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.moveTo(b.x - 42, 148);
    ctx.lineTo(b.x + 42, 148);
    ctx.arc(b.x + 42, 157, 9, -Math.PI/2, Math.PI/2);
    ctx.lineTo(b.x - 42, 166);
    ctx.arc(b.x - 42, 157, 9, Math.PI/2, -Math.PI/2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = b.c + '60';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    // Text
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = b.c;
    ctx.textAlign = 'center';
    ctx.fillText(b.text, b.x, 161);
  });

  // Bottom info
  ctx.font = '12px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.textAlign = 'center';
  ctx.fillText('Pure HTML5 Canvas \u00B7 No Download Required', 315, 472);

  // Version
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#06f';
  ctx.textAlign = 'right';
  ctx.fillText('v6.5', 618, 492);
}

drawCover();

function downloadCover() {
  const link = document.createElement('a');
  link.download = 'kite-legend-cover-630x500.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function downloadCover315() {
  const c2 = document.createElement('canvas');
  c2.width = 315;
  c2.height = 250;
  const x2 = c2.getContext('2d');
  x2.drawImage(canvas, 0, 0, 315, 250);
  const link = document.createElement('a');
  link.download = 'kite-legend-thumb-315x250.png';
  link.href = c2.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
