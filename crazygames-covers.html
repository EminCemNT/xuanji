<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>CrazyGames Cover Generator — Kite Legend</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a14;color:#fff;font-family:"Segoe UI",sans-serif;text-align:center;padding:20px;}
  h1{font-size:24px;margin-bottom:8px;color:#0cf;}
  p.desc{color:#888;margin-bottom:24px;font-size:13px;}
  .covers{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-bottom:24px;}
  .card{background:#111122;border:1px solid #222;border-radius:12px;padding:12px;max-width:420px;}
  .card img{border-radius:8px;width:100%;display:block;}
  .card .label{font-size:13px;color:#aaa;margin-top:8px;}
  .card .size{font-size:11px;color:#666;}
  .card .btn{display:inline-block;margin-top:10px;padding:8px 20px;background:#0af;color:#000;border-radius:6px;
    text-decoration:none;font-weight:700;font-size:13px;cursor:pointer;border:none;}
  .card .btn:hover{background:#0ff;}
  .download-all{padding:12px 36px;background:#f80;color:#000;border-radius:8px;font-weight:700;font-size:15px;
    cursor:pointer;border:none;margin-top:8px;}
  .download-all:hover{background:#fa0;}
</style>
</head>
<body>
<h1>🎮 Kite Legend — CrazyGames Cover Generator</h1>
<p class="desc">生成提交 CrazyGames 需要的 3 种尺寸封面图</p>

<div class="covers" id="covers"></div>

<button class="download-all" onclick="downloadAll()">⬇️ 一键下载全部 (3张)</button>

<script>
// ============ Canvas Drawing Engine ============
const TWO_PI = Math.PI * 2;

function starField(ctx, w, h, count) {
  for (let i = 0; i < count; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = Math.random() * 1.5 + 0.3;
    const alpha = Math.random() * 0.6 + 0.2;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI); ctx.fill();
  }
}

function drawPlayer(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

  // Body
  ctx.beginPath();
  ctx.moveTo(0, -24); ctx.lineTo(16, -4); ctx.lineTo(22, 8);
  ctx.lineTo(14, 18); ctx.lineTo(0, 24); ctx.lineTo(-14, 18);
  ctx.lineTo(-22, 8); ctx.lineTo(-16, -4); ctx.closePath();
  const grad = ctx.createLinearGradient(0, -24, 0, 24);
  grad.addColorStop(0, '#3a1a05'); grad.addColorStop(0.3, '#1a0d05');
  grad.addColorStop(0.7, '#152040'); grad.addColorStop(1, '#1a2040');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#f80'; ctx.lineWidth = 2 / s;
  ctx.shadowColor = '#f80'; ctx.shadowBlur = 12 / s; ctx.stroke(); ctx.shadowBlur = 0;

  // Core
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, 10);
  core.addColorStop(0, 'rgba(0,255,255,0.8)');
  core.addColorStop(0.4, 'rgba(0,180,255,0.4)');
  core.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, 12, 0, TWO_PI); ctx.fill();

  // Trail
  const tl = 30;
  const tg = ctx.createLinearGradient(0, 20, 0, 20 + tl);
  tg.addColorStop(0, 'rgba(0,220,255,0.9)');
  tg.addColorStop(0.3, 'rgba(0,150,255,0.5)');
  tg.addColorStop(0.7, 'rgba(0,80,255,0.15)');
  tg.addColorStop(1, 'rgba(0,30,255,0)');
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.moveTo(-6, 20); ctx.lineTo(6, 20);
  ctx.lineTo(14, 20 + tl); ctx.lineTo(-14, 20 + tl); ctx.closePath(); ctx.fill();

  ctx.restore();
}

function drawEnemy(ctx, x, y, s, color, type) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

  if (type === 'boss') {
    // Boss: large hexagon
    const r = 40;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 - Math.PI / 2;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(80,0,0,0.8)';
    ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 3 / s;
    ctx.shadowColor = color; ctx.shadowBlur = 20 / s; ctx.stroke(); ctx.shadowBlur = 0;

    // Inner core
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 15);
    cg.addColorStop(0, 'rgba(255,100,50,0.9)');
    cg.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, TWO_PI); ctx.fill();

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, -5, 8, 0, TWO_PI); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(3, -5, 5, 0, TWO_PI); ctx.fill();

  } else {
    // Small enemy: diamond
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(8, 0); ctx.lineTo(0, 14);
    ctx.lineTo(-8, 0); ctx.closePath();
    ctx.fillStyle = color.replace('1)', '0.8)').replace('rgb', 'rgba');
    ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.5 / s;
    ctx.stroke();

    // Glow
    const eg = ctx.createRadialGradient(0, 0, 0, 0, 0, 10);
    eg.addColorStop(0, 'rgba(255,255,255,0.4)');
    eg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TWO_PI); ctx.fill();
  }

  ctx.restore();
}

function drawBullet(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x, y, size, 0, TWO_PI); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawPurpleDiamond(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -10); ctx.lineTo(6, 0); ctx.lineTo(0, 10);
  ctx.lineTo(-6, 0); ctx.closePath();
  ctx.fillStyle = 'rgba(160,60,255,0.9)';
  ctx.fill();
  ctx.strokeStyle = '#f0f'; ctx.lineWidth = 1.5;
  ctx.shadowColor = '#f0f'; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.restore();
}

function drawTitle(ctx, w, h, scale) {
  ctx.save();
  // Title background glow
  const tglow = ctx.createRadialGradient(w / 2, h * 0.25, 0, w / 2, h * 0.25, w * 0.6);
  tglow.addColorStop(0, 'rgba(0,180,255,0.08)');
  tglow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = tglow;
  ctx.fillRect(0, 0, w, h);

  // Main title
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const ts = 72 * scale;
  ctx.font = `bold ${ts}px "Segoe UI", Arial, sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 20;
  ctx.fillText('KITE LEGEND', w / 2, h * 0.2 - ts * 0.3);
  ctx.shadowBlur = 0;

  ctx.font = `bold ${ts * 0.55}px "Segoe UI", Arial, sans-serif`;
  ctx.fillStyle = '#0cf';
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 12;
  ctx.fillText('I N T E R S T E L L A R', w / 2, h * 0.2 + ts * 0.25);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.font = `${ts * 0.3}px "Segoe UI", sans-serif`;
  ctx.fillStyle = '#aaa';
  ctx.fillText('A Vertical-Scrolling Shoot\'Em Up', w / 2, h * 0.2 + ts * 0.55);

  // Bottom features row
  const feats = ['Boss Phases', 'Roguelite Upgrades', 'Bullet Hell', 'Pure HTML5'];
  const fs = ts * 0.22;
  ctx.font = `${fs}px "Segoe UI", sans-serif`;
  const fx = w / 2 - ((feats.length - 1) * 200 * scale) / 2;
  feats.forEach((f, i) => {
    const px = fx + i * 200 * scale;
    ctx.fillStyle = '#888';
    ctx.fillText('◆ ' + f, px, h * 0.88);
  });

  ctx.restore();
}

// ============ Scene Generators ============

function generateLandscape(canvas) {
  const w = 1920, h = 1080;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const scale = w / 1920;

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#050510');
  bg.addColorStop(0.5, '#080822');
  bg.addColorStop(1, '#0a0a2e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  starField(ctx, w, h, 400);

  // Draw action scene — boss on left, player on right, bullets between
  drawEnemy(ctx, 400, h * 0.55, 1.5, '#f44', 'boss');
  drawPlayer(ctx, 1450, h * 0.5, 1.6);

  // Small enemies
  drawEnemy(ctx, 600, h * 0.28, 0.7, '#f80', 'small');
  drawEnemy(ctx, 250, h * 0.75, 0.6, '#f0f', 'small');
  drawEnemy(ctx, 700, h * 0.72, 0.55, '#0ff', 'small');

  // Bullets from boss
  for (let i = 0; i < 25; i++) {
    const a = (i / 25) * TWO_PI + Math.random() * 0.3;
    const dist = 120 + Math.random() * 250;
    const bx = 400 + Math.cos(a) * dist;
    const by = h * 0.55 + Math.sin(a) * dist * 0.6;
    const colors = ['#ff4444', '#ffaa44', '#ff44aa'];
    drawBullet(ctx, bx, by, 3 + Math.random() * 3, colors[i % 3]);
  }

  // Player bullets
  for (let i = 0; i < 12; i++) {
    const bx = 1400 + Math.random() * 100 - 300;
    const by = h * 0.5 + (Math.random() - 0.5) * 300;
    drawBullet(ctx, bx, by, 2 + Math.random() * 2, '#0ff');
  }

  // Particle explosions
  for (let i = 0; i < 30; i++) {
    const px = 800 + Math.random() * 400;
    const py = h * 0.5 + (Math.random() - 0.5) * 200;
    ctx.fillStyle = `rgba(${Math.random() > 0.5 ? '255,150,50' : '255,200,100'},${0.3 + Math.random() * 0.5})`;
    ctx.beginPath();
    ctx.arc(px, py, 2 + Math.random() * 5, 0, TWO_PI);
    ctx.fill();
  }

  // Purple diamond item
  drawPurpleDiamond(ctx, 1050, h * 0.6, 1.8);

  drawTitle(ctx, w, h, scale * 0.8);

  // "PLAY NOW" badge
  ctx.font = `bold ${36}px "Segoe UI", sans-serif`;
  ctx.fillStyle = '#0f0';
  ctx.shadowColor = '#0f0';
  ctx.shadowBlur = 15;
  ctx.textAlign = 'center';
  ctx.fillText('▶  PLAY NOW  ◀', w / 2, h * 0.95);
  ctx.shadowBlur = 0;
}

function generatePortrait(canvas) {
  const w = 800, h = 1200;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const scale = w / 800;

  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#050510');
  bg.addColorStop(0.5, '#080822');
  bg.addColorStop(1, '#0a0a2e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  starField(ctx, w, h, 200);

  // Boss at top
  drawEnemy(ctx, w / 2, h * 0.28, 1.6, '#f44', 'boss');

  // Player at bottom
  drawPlayer(ctx, w / 2, h * 0.68, 1.5);

  // Bullets around boss
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * TWO_PI;
    const dist = 100 + Math.random() * 180;
    const bx = w / 2 + Math.cos(a) * dist;
    const by = h * 0.28 + Math.sin(a) * dist * 0.6;
    drawBullet(ctx, bx, by, 2.5 + Math.random() * 2, i % 3 === 0 ? '#f44' : '#f84');
  }

  // Player bullets going up
  for (let i = 0; i < 10; i++) {
    const by = h * 0.68 - 40 - Math.random() * 200;
    const bx = w / 2 + (Math.random() - 0.5) * 120;
    drawBullet(ctx, bx, by, 2 + Math.random() * 1.5, '#0ff');
  }

  // Purple diamond
  drawPurpleDiamond(ctx, w / 2, h * 0.48, 1.5);

  // Explosions
  for (let i = 0; i < 20; i++) {
    const px = w / 2 + (Math.random() - 0.5) * 300;
    const py = h * 0.45 + (Math.random() - 0.5) * 150;
    ctx.fillStyle = `rgba(255,${100 + Math.random() * 150},50,${0.3 + Math.random() * 0.4})`;
    ctx.beginPath();
    ctx.arc(px, py, 2 + Math.random() * 4, 0, TWO_PI);
    ctx.fill();
  }

  drawTitle(ctx, w, h, scale * 0.7);

  // Mobile tag
  ctx.font = `bold ${26}px "Segoe UI", sans-serif`;
  ctx.fillStyle = '#0f0';
  ctx.shadowColor = '#0f0';
  ctx.shadowBlur = 10;
  ctx.textAlign = 'center';
  ctx.fillText('📱  Mobile Ready', w / 2, h * 0.97);
  ctx.shadowBlur = 0;
}

function generateSquare(canvas) {
  const w = 800, h = 800;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const scale = w / 800;

  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#050510');
  bg.addColorStop(0.5, '#080822');
  bg.addColorStop(1, '#0a0a2e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  starField(ctx, w, h, 180);

  // Player center
  drawPlayer(ctx, w / 2, h * 0.52, 1.8);

  // Enemies around
  drawEnemy(ctx, 120, 180, 0.6, '#f80', 'small');
  drawEnemy(ctx, w - 120, 200, 0.55, '#f0f', 'small');
  drawEnemy(ctx, 150, h - 150, 0.5, '#0ff', 'small');
  drawEnemy(ctx, w - 140, h - 170, 0.6, '#f44', 'small');

  // Bullet ring
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * TWO_PI;
    const r = 140 + Math.random() * 60;
    const bx = w / 2 + Math.cos(a) * r;
    const by = h * 0.52 + Math.sin(a) * r * 0.7;
    const colors = ['#ff4444', '#ffaa44', '#44ff44', '#44aaff'];
    drawBullet(ctx, bx, by, 2.5 + Math.random() * 3, colors[i % 4]);
  }

  // Purple diamond
  drawPurpleDiamond(ctx, w / 2 + 80, h * 0.3, 1.6);

  // Particles
  for (let i = 0; i < 15; i++) {
    const px = w / 2 + (Math.random() - 0.5) * 250;
    const py = h * 0.52 + (Math.random() - 0.5) * 200;
    ctx.fillStyle = `rgba(0,200,255,${0.3 + Math.random() * 0.5})`;
    ctx.beginPath();
    ctx.arc(px, py, 2 + Math.random() * 4, 0, TWO_PI);
    ctx.fill();
  }

  // Title
  ctx.font = `bold ${44}px "Segoe UI", Arial, sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 14;
  ctx.textAlign = 'center';
  ctx.fillText('KITE LEGEND', w / 2, 90);
  ctx.shadowBlur = 0;

  ctx.font = `bold ${26}px "Segoe UI", sans-serif`;
  ctx.fillStyle = '#0cf';
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 8;
  ctx.fillText('INTERSTELLAR', w / 2, 126);
  ctx.shadowBlur = 0;

  // Features
  ctx.font = `18px "Segoe UI", sans-serif`;
  ctx.fillStyle = '#888';
  ctx.fillText('Boss Phases · Roguelite Upgrades · Bullet Hell', w / 2, h - 36);
}

// ============ Generate & Display ============

const sizes = [
  { id: 'landscape', w: 1920, h: 1080, label: 'Landscape 16:9', fn: generateLandscape },
  { id: 'portrait', w: 800, h: 1200, label: 'Portrait 2:3', fn: generatePortrait },
  { id: 'square', w: 800, h: 800, label: 'Square 1:1', fn: generateSquare },
];

const canvases = {};
const coversDiv = document.getElementById('covers');

sizes.forEach(s => {
  const canvas = document.createElement('canvas');
  canvas.style.display = 'none';
  document.body.appendChild(canvas);
  s.fn(canvas);
  canvases[s.id] = canvas;

  const card = document.createElement('div');
  card.className = 'card';

  const img = document.createElement('img');
  img.src = canvas.toDataURL('image/png');
  img.alt = s.label;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = s.label;

  const size = document.createElement('div');
  size.className = 'size';
  size.textContent = `${s.w} × ${s.h}`;

  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '⬇️ Download PNG';
  btn.onclick = () => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `kite-legend-${s.id}.png`;
    a.click();
  };

  card.appendChild(img);
  card.appendChild(label);
  card.appendChild(size);
  card.appendChild(document.createElement('br'));
  card.appendChild(btn);
  coversDiv.appendChild(card);
});

function downloadAll() {
  sizes.forEach((s, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = canvases[s.id].toDataURL('image/png');
      a.download = `kite-legend-${s.id}.png`;
      a.click();
    }, i * 300);
  });
}
</script>
</body>
</html>
